
- type: entity
  name: guild MK58
  parent: [BaseWeaponPistol, BaseSecurityContraband]
  id: WeaponPistolGuildMk58
  description: A bog standard semi-automatic pistol chambered in thirty-five. Slim, simple, and accurate in the right hands, it's one of NanoTrasen Small Arms' crown jewels and the most common sidearm in the free world. Feeds from .35 Auto pistol magazines. # Goobstation
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Pistols/mk58.rsi #GoobStation Resprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Guns/Pistols/mk58.rsi #GoobStation Resprite
  - type: Item
    storedOffset: 0,-2
  - type: Gun
    fireRate: 4
    burstFireRate: 18
    availableModes:
    - SemiAuto
    - Burst
    shotsPerBurst: 2
    burstCooldown: 0.5
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/pistol.ogg
  # mk58 upgrade start
  - type: ItemUpgradeable
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
      flashlight: !type:ContainerSlot
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistol
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistol
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgePistol
        priority: 1
        whitelist:
          tags:
            - CartridgePistol
      flashlight:
        name: weapon-upgrade-slot-name-flashlight
        priority: 1
        insertDelay: 0.4
        ejectDelay: 0.2
        ejectOnBreak: true
        occludesLight: false
        whitelist:
          components:
          - GunUpgradeFlashlight
  - type: ItemMapper
    mapLayers:
      flashlight:
        whitelist:
          components:
          - GunUpgradeFlashlight
  # mk58 upgrade end
  - type: StealTarget
    stealGroup: OfficerHandgun
